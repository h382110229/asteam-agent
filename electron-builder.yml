appId: online.ashawk.asteam.agent
productName: ASTeam Agent
directories:
  output: dist-release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - build/icon.ico
  - build/icon.png
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ASTeam Agent
  artifactName: ${productName}-Setup-${version}.${ext}
portable:
  artifactName: ${productName}-Portable-${version}.${ext}
